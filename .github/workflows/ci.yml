name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Ubuntu 22.04 matches JetPack 6 (GCC 11, Python 3.10), so a pass here is a pass there.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ make
          python -m pip install numpy pytest pypdf
      - name: C++ core and unit tests (warnings are errors)
        run: make test-core
      - name: Python tests
        run: make test-py
      - name: Generate a labeled set and score the core
        run: |
          make synth EVENTS=300 SEED=7
          make eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results

  container-arm64:
    # The same image the Jetson runs, cross-built under QEMU.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: false
          tags: relay-event-analyst:ci
